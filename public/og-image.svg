<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D99B26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glows -->
  <circle cx="1050" cy="150" r="300" fill="#1D4ED8" opacity="0.2" filter="url(#glow)"/>
  <circle cx="200" cy="500" r="220" fill="#D99B26" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Content Container -->
  <g transform="translate(100, 90)">
    <!-- Top Pill / Badge -->
    <rect width="440" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(217, 155, 38, 0.4)" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#D99B26"/>
    <text x="42" y="27" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
      2026 / 2027 INTERNATIONAL ADMISSIONS
    </text>

    <!-- Main Title -->
    <text x="0" y="140" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">
      YOUR PATHWAY TO
    </text>
    <text x="0" y="210" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1">
      STUDY IN INDIA
    </text>

    <!-- Brand Subtitle -->
    <text x="0" y="280" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Accredited Degrees • Visa Guidance • Admission Support • Arrival Care
    </text>

    <!-- Trust Stats Pill Grid -->
    <g transform="translate(0, 330)">
      <rect width="210" height="74" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="24" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">50+ Degrees</text>
      <text x="24" y="56" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">B.Tech, MBA, Allied Health</text>

      <g transform="translate(230, 0)">
        <rect width="210" height="74" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
        <text x="24" y="34" fill="#D99B26" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">100% Verified</text>
        <text x="24" y="56" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">UGC & AICTE Accredited</text>
      </g>

      <g transform="translate(460, 0)">
        <rect width="210" height="74" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
        <text x="24" y="34" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Direct Support</text>
        <text x="24" y="56" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">India & Liberia Desks</text>
      </g>
    </g>
  </g>

  <!-- Right Side Brand Logo Emblem Card -->
  <g transform="translate(850, 165)">
    <rect width="250" height="300" rx="32" fill="#FFFFFF" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))"/>
    
    <!-- Emblem -->
    <g transform="translate(25, 20) scale(1.0)">
      <path d="M 28 95 C 36 56, 64 36, 100 36 C 136 36, 164 56, 172 95 L 138 95 C 133 74, 119 62, 100 62 C 81 62, 67 74, 62 95 Z" fill="#111827" />
      <path d="M 62 95 C 66 79, 81 69, 100 69 C 119 69, 134 79, 138 95 Z" fill="#FFFFFF" />
      <path d="M 40 105 C 46 138, 70 164, 100 164 C 130 164, 154 138, 160 105 L 186 105 C 178 126, 154 154, 126 163 C 110 168, 90 168, 74 163 C 50 152, 42 130, 40 105 Z" fill="#D99B26" />
    </g>

    <!-- Text inside card -->
    <text x="125" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#111827" letter-spacing="2">MYERS</text>
    <text x="125" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#D99B26" letter-spacing="2">GLOBAL PATHWAYS</text>
  </g>
</svg>
