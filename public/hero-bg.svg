<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Lighting & Atmospheric Gradients -->
    <linearGradient id="hallGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0A0A" />
      <stop offset="30%" stop-color="#3B1219" />
      <stop offset="70%" stop-color="#2A0B10" />
      <stop offset="100%" stop-color="#0F0305" />
    </linearGradient>

    <!-- Auditorium Wall Red & Gold Stripes -->
    <linearGradient id="wallPanel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="15%" stop-color="#7F1D1D" />
      <stop offset="25%" stop-color="#D97706" />
      <stop offset="30%" stop-color="#7F1D1D" />
      <stop offset="50%" stop-color="#991B1B" />
      <stop offset="65%" stop-color="#7F1D1D" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Red Velvet Seats Gradient -->
    <linearGradient id="seatRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Gown Satin & Shadows -->
    <linearGradient id="gownDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="leatherChair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#hallGlow)" />

  <!-- Background Auditorium Wall with Vertical Acoustic Panels -->
  <g opacity="0.35">
    <rect x="0" y="0" width="1600" height="400" fill="url(#wallPanel)" />
    <!-- Ambient Ceiling Spotlight Cones -->
    <polygon points="300,0 100,500 500,500" fill="#FEF08A" opacity="0.08" />
    <polygon points="800,0 600,500 1000,500" fill="#FEF08A" opacity="0.1" />
    <polygon points="1300,0 1100,500 1500,500" fill="#FEF08A" opacity="0.08" />
  </g>

  <!-- Tiered Rows of Red Auditorium Chairs (Background Rows) -->
  <!-- Top Tier 1 -->
  <g opacity="0.5">
    <rect x="500" y="30" width="80" height="90" rx="18" fill="url(#seatRed)" />
    <rect x="600" y="30" width="80" height="90" rx="18" fill="url(#seatRed)" />
    <rect x="700" y="30" width="80" height="90" rx="18" fill="url(#seatRed)" />
    <rect x="800" y="30" width="80" height="90" rx="18" fill="url(#seatRed)" />
    <rect x="900" y="30" width="80" height="90" rx="18" fill="url(#seatRed)" />
    <rect x="1000" y="30" width="80" height="90" rx="18" fill="url(#seatRed)" />
    <rect x="1100" y="30" width="80" height="90" rx="18" fill="url(#seatRed)" />
    <rect x="1200" y="30" width="80" height="90" rx="18" fill="url(#seatRed)" />
  </g>

  <!-- Tier 2 -->
  <g opacity="0.7">
    <rect x="420" y="80" width="95" height="110" rx="20" fill="url(#seatRed)" />
    <rect x="540" y="80" width="95" height="110" rx="20" fill="url(#seatRed)" />
    <rect x="660" y="80" width="95" height="110" rx="20" fill="url(#seatRed)" />
    <rect x="780" y="80" width="95" height="110" rx="20" fill="url(#seatRed)" />
    <rect x="900" y="80" width="95" height="110" rx="20" fill="url(#seatRed)" />
    <rect x="1020" y="80" width="95" height="110" rx="20" fill="url(#seatRed)" />
    <rect x="1140" y="80" width="95" height="110" rx="20" fill="url(#seatRed)" />
    <rect x="1260" y="80" width="95" height="110" rx="20" fill="url(#seatRed)" />
  </g>

  <!-- Tier 3 -->
  <g opacity="0.85">
    <rect x="350" y="150" width="115" height="130" rx="24" fill="url(#seatRed)" />
    <rect x="490" y="150" width="115" height="130" rx="24" fill="url(#seatRed)" />
    <rect x="630" y="150" width="115" height="130" rx="24" fill="url(#seatRed)" />
    <rect x="770" y="150" width="115" height="130" rx="24" fill="url(#seatRed)" />
    <rect x="910" y="150" width="115" height="130" rx="24" fill="url(#seatRed)" />
    <rect x="1050" y="150" width="115" height="130" rx="24" fill="url(#seatRed)" />
    <rect x="1190" y="150" width="115" height="130" rx="24" fill="url(#seatRed)" />
    <rect x="1330" y="150" width="115" height="130" rx="24" fill="url(#seatRed)" />
  </g>

  <!-- Main Seated Row Chairs (Behind the 5 Graduates) -->
  <g>
    <!-- Chair 1 -->
    <rect x="160" y="240" width="180" height="400" rx="36" fill="url(#seatRed)" stroke="#B91C1C" stroke-width="4" />
    <rect x="175" y="255" width="150" height="370" rx="28" fill="#DC2626" opacity="0.6" />

    <!-- Chair 2 -->
    <rect x="420" y="240" width="180" height="400" rx="36" fill="url(#seatRed)" stroke="#B91C1C" stroke-width="4" />
    <rect x="435" y="255" width="150" height="370" rx="28" fill="#DC2626" opacity="0.6" />

    <!-- Chair 3 -->
    <rect x="690" y="240" width="180" height="400" rx="36" fill="url(#seatRed)" stroke="#B91C1C" stroke-width="4" />
    <rect x="705" y="255" width="150" height="370" rx="28" fill="#DC2626" opacity="0.6" />

    <!-- Chair 4 -->
    <rect x="960" y="240" width="180" height="400" rx="36" fill="url(#seatRed)" stroke="#B91C1C" stroke-width="4" />
    <rect x="975" y="255" width="150" height="370" rx="28" fill="#DC2626" opacity="0.6" />

    <!-- Chair 5 -->
    <rect x="1230" y="240" width="180" height="400" rx="36" fill="url(#seatRed)" stroke="#B91C1C" stroke-width="4" />
    <rect x="1245" y="255" width="150" height="370" rx="28" fill="#DC2626" opacity="0.6" />
  </g>

  <!-- 5 INTERNATIONAL GRADUATES IN FULL CONVOCATION REGALIA -->

  <!-- GRADUATE 1: MS. JULI (Left) -->
  <g id="grad-juli">
    <!-- Academic Gown with Green Trim -->
    <path d="M 120 780 L 170 380 L 250 360 L 330 380 L 380 780 Z" fill="url(#gownDark)" />
    <!-- Green Satin Sash with Gold trim -->
    <path d="M 175 380 L 225 380 L 210 700 L 155 700 Z" fill="#065F46" stroke="#FACC15" stroke-width="3" />
    <path d="M 275 380 L 325 380 L 345 700 L 290 700 Z" fill="#065F46" stroke="#FACC15" stroke-width="3" />
    <text x="188" y="480" font-size="14" font-weight="900" font-family="sans-serif" fill="#FFFFFF">MS.</text>
    <text x="188" y="520" font-size="16" font-weight="900" font-family="sans-serif" fill="#FFFFFF">JULI</text>
    <text x="312" y="490" font-size="18" font-weight="900" font-family="sans-serif" fill="#FFFFFF">MSC</text>
    
    <!-- Head & Cap -->
    <circle cx="250" cy="320" r="42" fill="#5A3521" />
    <!-- Sunglasses -->
    <rect x="225" y="315" width="22" height="14" rx="4" fill="#0F172A" />
    <rect x="253" y="315" width="22" height="14" rx="4" fill="#0F172A" />
    <line x1="247" y1="322" x2="253" y2="322" stroke="#E2E8F0" stroke-width="2" />
    <!-- Mortarboard Cap -->
    <polygon points="250,220 320,265 250,295 180,265" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <circle cx="250" cy="265" r="4" fill="#EAB308" />
  </g>

  <!-- GRADUATE 2: MYERS (Fresh Study India Graduate Leader) -->
  <g id="grad-myers">
    <!-- Academic Gown -->
    <path d="M 380 780 L 430 360 L 510 340 L 590 360 L 640 780 Z" fill="url(#gownDark)" />
    <!-- Black and Gold Sash with "MYERS" & "S&I" -->
    <path d="M 430 360 L 485 360 L 470 710 L 415 710 Z" fill="#0F172A" stroke="#FACC15" stroke-width="4" />
    <path d="M 535 360 L 590 360 L 605 710 L 550 710 Z" fill="#0F172A" stroke="#FACC15" stroke-width="4" />
    <!-- Horizontal Gold Stole Yoke -->
    <path d="M 425 390 L 595 390 L 590 415 L 430 415 Z" fill="#FACC15" />
    
    <!-- Sash Text "MYERS" -->
    <text x="450" y="470" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">M</text>
    <text x="450" y="495" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">Y</text>
    <text x="450" y="520" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">E</text>
    <text x="450" y="545" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">R</text>
    <text x="450" y="570" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">S</text>

    <!-- Sash Text "S & I" -->
    <text x="575" y="490" font-size="15" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">S</text>
    <text x="575" y="515" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">&amp;</text>
    <text x="575" y="540" font-size="15" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">I</text>

    <!-- Head & Smile -->
    <circle cx="510" cy="310" r="44" fill="#55331E" />
    <!-- Mortarboard Cap with Golden Tassel -->
    <polygon points="510,210 585,255 510,285 435,255" fill="#090D14" stroke="#1E293B" stroke-width="2.5" />
    <circle cx="510" cy="255" r="5" fill="#EAB308" />
    <path d="M 510 255 Q 460 270 445 320" fill="none" stroke="#FACC15" stroke-width="3" />
    
    <!-- White Certificate Paper held in hands -->
    <polygon points="460,630 550,600 560,690 470,720" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.4))" />
    <line x1="475" y1="635" x2="535" y2="615" stroke="#94A3B8" stroke-width="2" />
    <line x1="480" y1="655" x2="540" y2="635" stroke="#94A3B8" stroke-width="2" />
  </g>

  <!-- GRADUATE 3: FEMALE GRADUATE (Blonde Hair & Tiara Mortarboard) -->
  <g id="grad-female">
    <!-- Academic Gown -->
    <path d="M 650 780 L 700 380 L 780 360 L 860 380 L 910 780 Z" fill="url(#gownDark)" />
    <!-- Sash with "CLASS OF 2026" -->
    <path d="M 700 380 L 755 380 L 740 710 L 685 710 Z" fill="#0F172A" stroke="#FACC15" stroke-width="3" />
    <path d="M 805 380 L 860 380 L 875 710 L 820 710 Z" fill="#0F172A" stroke="#FACC15" stroke-width="3" />
    <text x="715" y="660" font-size="11" font-weight="900" font-family="sans-serif" fill="#FDE047">CLASS</text>
    <text x="715" y="675" font-size="10" font-weight="800" font-family="sans-serif" fill="#FDE047">OF</text>
    <text x="715" y="690" font-size="12" font-weight="900" font-family="sans-serif" fill="#FDE047">2026</text>

    <!-- Platinum Blonde Waves -->
    <path d="M 720 310 Q 690 400 700 500 Q 730 460 740 370 Z" fill="#FEF08A" opacity="0.95" />
    <path d="M 840 310 Q 870 400 860 500 Q 830 460 820 370 Z" fill="#FEF08A" opacity="0.95" />
    
    <!-- Head -->
    <circle cx="780" cy="320" r="40" fill="#6A4026" />
    <!-- Mortarboard with Sparkling Tiara Crest -->
    <polygon points="780,225 850,268 780,298 710,268" fill="#090D14" stroke="#334155" stroke-width="2" />
    <polygon points="750,265 765,245 780,265 795,245 810,265" fill="#E2E8F0" stroke="#FACC15" stroke-width="1.5" />
  </g>

  <!-- GRADUATE 4: DOMINIC (CS & IT) -->
  <g id="grad-dominic">
    <!-- Blue Suit & Gown -->
    <path d="M 920 780 L 970 370 L 1050 350 L 1130 370 L 1180 780 Z" fill="url(#gownDark)" />
    <!-- Black & Yellow Sash: "CS & IT" & "DOMINIC" -->
    <path d="M 970 370 L 1025 370 L 1010 710 L 955 710 Z" fill="#0F172A" stroke="#FACC15" stroke-width="4" />
    <path d="M 1075 370 L 1130 370 L 1145 710 L 1090 710 Z" fill="#0F172A" stroke="#FACC15" stroke-width="4" />
    
    <text x="985" y="470" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">CS</text>
    <text x="985" y="495" font-size="13" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">&amp;</text>
    <text x="985" y="520" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">IT</text>
    
    <text x="1115" y="465" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">D</text>
    <text x="1115" y="488" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">O</text>
    <text x="1115" y="511" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">M</text>
    <text x="1115" y="534" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">I</text>
    <text x="1115" y="557" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">N</text>
    <text x="1115" y="580" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">I</text>
    <text x="1115" y="603" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">C</text>

    <!-- Head & Sunglasses -->
    <circle cx="1050" cy="320" r="42" fill="#55331E" />
    <rect x="1025" y="315" width="22" height="14" rx="4" fill="#0F172A" />
    <rect x="1053" y="315" width="22" height="14" rx="4" fill="#0F172A" />
    <line x1="1047" y1="322" x2="1053" y2="322" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Mortarboard tilted with hand adjusting -->
    <polygon points="1050,215 1120,260 1050,290 980,260" fill="#090D14" stroke="#334155" stroke-width="2" />
    <!-- Hand adjusting cap -->
    <ellipse cx="1115" cy="275" rx="14" ry="18" fill="#55331E" stroke="#2B150A" stroke-width="1.5" />
  </g>

  <!-- GRADUATE 5: BSC CS GRADUATE (Right) -->
  <g id="grad-5">
    <path d="M 1190 780 L 1240 380 L 1320 360 L 1400 380 L 1450 780 Z" fill="url(#gownDark)" />
    <!-- Sash "BSC CS" -->
    <path d="M 1240 380 L 1295 380 L 1280 710 L 1225 710 Z" fill="#0F172A" stroke="#FACC15" stroke-width="4" />
    <path d="M 1345 380 L 1400 380 L 1415 710 L 1360 710 Z" fill="#0F172A" stroke="#FACC15" stroke-width="4" />
    <text x="1260" y="475" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">B</text>
    <text x="1260" y="498" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">S</text>
    <text x="1260" y="521" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">C</text>
    <text x="1260" y="548" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">C</text>
    <text x="1260" y="571" font-size="14" font-weight="900" font-family="sans-serif" fill="#FDE047" text-anchor="middle">S</text>

    <!-- Head & Cap -->
    <circle cx="1320" cy="325" r="42" fill="#4C2816" />
    <polygon points="1320,230 1390,275 1320,305 1250,275" fill="#090D14" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Foreground Row Leather Railing / Lower Auditorium Bar -->
  <rect x="0" y="810" width="1600" height="100" fill="url(#leatherChair)" stroke="#431407" stroke-width="6" />
  <rect x="0" y="810" width="1600" height="15" fill="#EA580C" opacity="0.3" />
</svg>
