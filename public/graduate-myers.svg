<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071220" />
      <stop offset="40%" stop-color="#0F243E" />
      <stop offset="100%" stop-color="#050C16" />
    </linearGradient>
    
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F462D" />
      <stop offset="50%" stop-color="#55331E" />
      <stop offset="100%" stop-color="#3D2212" />
    </linearGradient>
    
    <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#845638" />
      <stop offset="100%" stop-color="#55331E" />
    </linearGradient>

    <linearGradient id="gownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222A" />
      <stop offset="50%" stop-color="#11141A" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>
    
    <linearGradient id="goldSash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="20%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="80%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    
    <linearGradient id="sashBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="maroonFolder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="40%" stop-color="#4C0519" />
      <stop offset="100%" stop-color="#28020D" />
    </linearGradient>

    <radialGradient id="campusGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0F243E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <circle cx="400" cy="350" r="380" fill="url(#campusGlow)" />

  <!-- Subtle Campus Architecture Silhouettes in Background -->
  <g opacity="0.15" fill="#38BDF8">
    <rect x="60" y="240" width="100" height="300" rx="4" />
    <rect x="180" y="190" width="140" height="350" rx="6" />
    <polygon points="250,140 170,190 330,190" />
    <rect x="480" y="210" width="130" height="330" rx="6" />
    <polygon points="545,160 470,210 620,210" />
    <rect x="630" y="250" width="110" height="290" rx="4" />
  </g>

  <!-- Tree foliage silhouettes (Lush green campus feel) -->
  <g opacity="0.3" fill="#047857">
    <circle cx="100" cy="420" r="110" />
    <circle cx="160" cy="380" r="90" />
    <circle cx="680" cy="400" r="120" />
    <circle cx="620" cy="360" r="80" />
  </g>

  <!-- Graduate Character -->
  <g id="graduate-figure">
    
    <!-- Body / Academic Gown Shoulders -->
    <path d="M 120 1000 L 160 620 L 250 510 L 350 490 L 450 490 L 550 510 L 640 620 L 680 1000 Z" fill="url(#gownGrad)" />
    
    <!-- Gown pleats & shadow lines -->
    <path d="M 270 530 L 220 1000" stroke="#000" stroke-width="6" opacity="0.4" />
    <path d="M 330 510 L 300 1000" stroke="#000" stroke-width="5" opacity="0.3" />
    <path d="M 470 510 L 500 1000" stroke="#000" stroke-width="5" opacity="0.3" />
    <path d="M 530 530 L 580 1000" stroke="#000" stroke-width="6" opacity="0.4" />
    <path d="M 400 495 L 400 1000" stroke="#050810" stroke-width="8" opacity="0.7" />

    <!-- White Shirt Collar & Black Tie in center V -->
    <polygon points="360,490 400,560 440,490 400,510" fill="#FFFFFF" />
    <polygon points="392,510 408,510 404,590 396,590" fill="#0F172A" />

    <!-- Left Stole (Viewer's Left - Right Shoulder of Graduate) -->
    <!-- Gold Sash Background & Yellow Ribbon Border -->
    <g id="stole-left">
      <path d="M 270 510 L 340 500 L 330 890 L 240 890 Z" fill="#EAB308" />
      <path d="M 276 512 L 334 503 L 324 882 L 246 882 Z" fill="#18181B" />
      
      <!-- SRU Logo Emblem Circle -->
      <circle cx="285" cy="550" r="22" fill="#FFFFFF" stroke="#EAB308" stroke-width="2.5" />
      <circle cx="285" cy="550" r="18" fill="#FFFBEB" />
      <text x="285" y="546" font-size="7" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#B45309">SRU</text>
      <text x="285" y="555" font-size="5" font-weight="700" font-family="sans-serif" text-anchor="middle" fill="#1E293B">INDIA</text>

      <!-- Letters "C S" -->
      <text x="285" y="588" font-size="10" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FACC15" letter-spacing="2">C S</text>
      
      <!-- Vertical Name "M Y E R S" -->
      <text x="285" y="618" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FDE047">M</text>
      <text x="285" y="640" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FDE047">Y</text>
      <text x="285" y="662" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FDE047">E</text>
      <text x="285" y="684" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FDE047">R</text>
      <text x="285" y="706" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FDE047">S</text>

      <!-- Liberian Flag Patch 🇱🇷 -->
      <g transform="translate(262, 725)">
        <rect x="0" y="0" width="46" height="28" fill="#B91C1C" rx="2" stroke="#FFFFFF" stroke-width="1.5" />
        <!-- White Stripes -->
        <rect x="0" y="5" width="46" height="4.5" fill="#FFFFFF" />
        <rect x="0" y="14" width="46" height="4.5" fill="#FFFFFF" />
        <rect x="0" y="23" width="46" height="4.5" fill="#FFFFFF" />
        <!-- Blue Canton with White Star -->
        <rect x="0" y="0" width="18" height="15" fill="#1D4ED8" />
        <polygon points="9,2 11,7 16,7 12,10 13,15 9,12 5,15 6,10 2,7 7,7" fill="#FFFFFF" />
      </g>

      <!-- CLASS OF 2026 -->
      <text x="285" y="780" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FDE047" letter-spacing="1">CLASS OF</text>
      <text x="285" y="800" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FACC15" letter-spacing="2">2026</text>
    </g>

    <!-- Right Stole (Viewer's Right - Left Shoulder of Graduate) -->
    <g id="stole-right">
      <path d="M 460 500 L 530 510 L 560 890 L 470 890 Z" fill="#EAB308" />
      <path d="M 466 503 L 524 512 L 554 882 L 476 882 Z" fill="#18181B" />
      
      <!-- B.Sc Microbiology vertical ribbon text -->
      <text x="515" y="570" font-size="13" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FDE047" letter-spacing="1">B.Sc</text>
      
      <text x="515" y="605" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">M</text>
      <text x="515" y="622" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">I</text>
      <text x="515" y="639" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">C</text>
      <text x="515" y="656" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">R</text>
      <text x="515" y="673" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">O</text>
      <text x="515" y="690" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">B</text>
      <text x="515" y="707" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">I</text>
      <text x="515" y="724" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">O</text>
      <text x="515" y="741" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">L</text>
      <text x="515" y="758" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">O</text>
      <text x="515" y="775" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">G</text>
      <text x="515" y="792" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FEF08A">Y</text>
      
      <!-- Star flourish -->
      <polygon points="515,820 519,830 530,830 522,836 525,846 515,840 505,846 508,836 500,830 511,830" fill="#EAB308" />
    </g>

    <!-- Diploma Certificate Folder held in hands -->
    <g id="diploma-folder" transform="translate(270, 750) rotate(-4)">
      <!-- Maroon leather folder -->
      <rect x="0" y="0" width="270" height="200" rx="8" fill="url(#maroonFolder)" stroke="#CA8A04" stroke-width="3.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.7))" />
      
      <!-- Gold inner border -->
      <rect x="12" y="12" width="246" height="176" rx="4" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8" />
      
      <!-- Gold Foil Crest -->
      <circle cx="135" cy="65" r="24" fill="none" stroke="#FACC15" stroke-width="2" />
      <polygon points="135,46 142,60 155,60 145,69 148,82 135,74 122,82 125,69 115,60 128,60" fill="#FDE047" />
      
      <!-- University Title on Folder -->
      <text x="135" y="112" font-size="11" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#FEF08A" letter-spacing="1">SHRI RAWATPURA SARKAR</text>
      <text x="135" y="128" font-size="10" font-weight="800" font-family="sans-serif" text-anchor="middle" fill="#FDE047" letter-spacing="2">UNIVERSITY</text>
      <text x="135" y="148" font-size="8" font-weight="600" font-family="sans-serif" text-anchor="middle" fill="#E2E8F0" opacity="0.9">RAIPUR, CHHATTISGARH, INDIA</text>
      <text x="135" y="165" font-size="8" font-weight="700" font-family="sans-serif" text-anchor="middle" fill="#CBD5E1">OFFICIAL DEGREE CERTIFICATE</text>

      <!-- Hands holding folder -->
      <g id="hands">
        <!-- Left thumb -->
        <ellipse cx="10" cy="110" rx="14" ry="24" fill="url(#skinGrad)" stroke="#27150A" stroke-width="1.5" />
        <!-- Right fingers -->
        <ellipse cx="260" cy="120" rx="14" ry="26" fill="url(#skinGrad)" stroke="#27150A" stroke-width="1.5" />
      </g>
    </g>

    <!-- Neck -->
    <path d="M 360 380 L 440 380 L 445 500 L 355 500 Z" fill="url(#skinGrad)" />
    <!-- Neck shadow -->
    <path d="M 360 420 Q 400 460 440 420 L 445 500 L 355 500 Z" fill="#28140B" opacity="0.4" />

    <!-- Head & Facial Features -->
    <g id="head">
      <!-- Head Base Shape -->
      <path d="M 330 290 Q 330 430 400 445 Q 470 430 470 290 Q 470 200 400 200 Q 330 200 330 290 Z" fill="url(#skinGrad)" />
      
      <!-- Jawline & Cheek Highlights -->
      <path d="M 345 320 Q 345 410 400 435 Q 455 410 455 320" fill="none" stroke="url(#skinHighlight)" stroke-width="4" opacity="0.5" />
      
      <!-- Ears -->
      <path d="M 330 300 Q 315 320 330 350" fill="url(#skinGrad)" stroke="#2B150A" stroke-width="2" />
      <path d="M 470 300 Q 485 320 470 350" fill="url(#skinGrad)" stroke="#2B150A" stroke-width="2" />

      <!-- Hairline / Short Black Hair Cut -->
      <path d="M 330 260 Q 400 210 470 260 L 470 220 Q 400 185 330 220 Z" fill="#09090B" />

      <!-- Eyes & Eyebrows -->
      <!-- Eyebrows -->
      <path d="M 350 285 Q 375 280 385 287" stroke="#0A0A0C" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M 415 287 Q 425 280 450 285" stroke="#0A0A0C" stroke-width="4" stroke-linecap="round" fill="none" />
      
      <!-- Eyes with warm bright glint -->
      <ellipse cx="368" cy="298" rx="10" ry="6" fill="#FFFFFF" />
      <circle cx="368" cy="298" r="4.5" fill="#1C1917" />
      <circle cx="370" cy="296" r="1.5" fill="#FFFFFF" />
      
      <ellipse cx="432" cy="298" rx="10" ry="6" fill="#FFFFFF" />
      <circle cx="432" cy="298" r="4.5" fill="#1C1917" />
      <circle cx="434" cy="296" r="1.5" fill="#FFFFFF" />

      <!-- Nose -->
      <path d="M 400 295 L 400 345 Q 388 350 400 355 Q 412 350 400 345" fill="#381B0E" opacity="0.6" />
      <path d="M 390 350 Q 400 358 410 350" stroke="#251209" stroke-width="2" fill="none" />

      <!-- Proud, Joyful Smile -->
      <!-- Teeth -->
      <path d="M 370 380 Q 400 415 430 380 Q 400 375 370 380 Z" fill="#FFFFFF" />
      <!-- Upper Lip -->
      <path d="M 368 377 Q 400 372 432 377" stroke="#3D1D10" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Lower Lip & Shadow -->
      <path d="M 372 385 Q 400 420 428 385" stroke="#482213" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <path d="M 385 418 Q 400 424 415 418" stroke="#2B140A" stroke-width="2" fill="none" opacity="0.6" />
    </g>

    <!-- Graduation Mortarboard Cap -->
    <g id="graduation-cap">
      <!-- Cap Base Skull Band -->
      <path d="M 345 230 Q 400 215 455 230 L 455 248 Q 400 238 345 248 Z" fill="#111827" />
      
      <!-- Diamond Flat Top (Mortarboard) -->
      <polygon points="400,120 540,195 400,245 260,195" fill="#090D14" stroke="#1F2937" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.8))" />
      
      <!-- Top Center Button -->
      <circle cx="400" cy="190" r="7" fill="#EAB308" stroke="#CA8A04" stroke-width="1.5" />
      
      <!-- Gold Tassel Ribbon & Hanging Brush -->
      <!-- Tassel Ribbon Strand -->
      <path d="M 400 190 Q 320 200 305 240 Q 295 280 290 320" fill="none" stroke="#FACC15" stroke-width="3" />
      <!-- Tassel Ring -->
      <rect x="286" y="320" width="8" height="6" rx="2" fill="#CA8A04" />
      <!-- Tassel Brush -->
      <polygon points="290,326 284,375 296,375" fill="#FDE047" />
      <line x1="287" y1="326" x2="286" y2="375" stroke="#EAB308" stroke-width="1" />
      <line x1="293" y1="326" x2="294" y2="375" stroke="#CA8A04" stroke-width="1" />
    </g>

  </g>

  <!-- Top Floating Verification Badge Banner -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="700" height="60" rx="16" fill="#0B192C" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
    <circle cx="35" cy="30" r="14" fill="#10B981" />
    <path d="M 28 30 L 33 35 L 42 25" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="28" font-size="14" font-weight="900" font-family="sans-serif" fill="#FFFFFF" letter-spacing="0.5">AUTHENTIC INTERNATIONAL STUDENT SUCCESS</text>
    <text x="60" y="47" font-size="12" font-weight="700" font-family="sans-serif" fill="#38BDF8">Myers • Liberia 🇱🇷 to India 🇮🇳 • Shri Rawatpura Sarkar University</text>
  </g>
</svg>
